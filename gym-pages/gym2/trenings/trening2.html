<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trening 2</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
    <script src="../../../scripts/main.js"></script>
    <link rel="stylesheet" href="../../../styles/style.css">
</head>
<body>
  <!--Navigation-->
  <nav class="navbar fixed-top navbar-dark bg-dark navbar-expand-md">
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbar">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="navbar-collapse collapse justify-content-center" id="navbar" navbar>
      <div class="d-flex justify-content-center">
      <ul class="navbar-nav">
        <button type="button" class="btn btn-primary mx-2 my-1"><li class="nav-item ms-2"><a href="../../../index.html" class="nav-link">Glavna</a></li></button>
        <button type="button" class="btn btn-primary mx-2 my-1" data-bs-toggle="modal" data-bs-target="#signInModal"><li class="nav-item ms-2"><a href="#" class="nav-link">Uloguj se</a></li></button>
        <button type="button" class="btn btn-primary mx-2 my-1" data-bs-toggle="modal" data-bs-target="#signUpModal"><li class="nav-item ms-2"><a href="#" class="nav-link">Registruj se</a></li></button>
        <button type="button" class="btn btn-primary mx-2 my-1"><li class="nav-item ms-2"><a href="../../../admin-page.html" class="nav-link">Admin panel</a></li></button>
      </ul>
    </div>
    </div>
  </nav>

  <!-- The Modal sign in -->
  <div class="modal fade" id="signInModal">
    <div class="modal-dialog">
      <div class="modal-content">

        <!-- Modal Header -->
        <div class="modal-header">
          <h4 class="modal-title">Uloguj se</h4>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <!-- Modal body -->
        <div class="modal-body">
          <form>
            <div class="form-group">
              <label for="exampleInputEmail1">Email adresa</label>
              <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp"
                placeholder="Unesi email" required>
              <small id="emailHelp" class="form-text text-muted">Vas mejl je bezbedan sa nama.</small>
            </div>
            <div class="form-group">
              <label for="exampleInputPassword1">Sifra</label>
              <input type="password" class="form-control" id="exampleInputPassword1" placeholder="Unesite sifru"
                required>
            </div>
            <div class="form-check">
              <input type="checkbox" class="form-check-input" id="exampleCheck1">
              <label class="form-check-label" for="exampleCheck1">Uslovi koriscenja</label>
            </div>
            <button type="submit" class="btn btn-primary">Uloguj se</button>
          </form>
        </div>

        <!-- Modal footer -->
        <div class="modal-footer">
          <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>
  <!-- The Modal sign up -->
  <div class="modal fade" id="signUpModal">
    <div class="modal-dialog">
      <div class="modal-content">

        <!-- Modal Header -->
        <div class="modal-header">
          <h4 class="modal-title">Registruj se</h4>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <!-- Modal body -->
        <div class="modal-body">
          <form>
            <div class="form-row px-3">
              <div class="col-md-4 mb-3 mx-2">
                <label class="form-label" for="validationDefault01">Ime</label>
                <input type="text" class="form-control" id="validationDefault01" placeholder="Ime" value="Mika"
                  required>
              </div>
              <div class="col-md-4 mb-3 mx-2">
                <label class="form-label" for="validationDefault02">Prezime</label>
                <input type="text" class="form-control" id="validationDefault02" placeholder="Prezime" value="Zikic"
                  required>
              </div>
              <div class="form-group mb-3 mx-2">
                <label class="form-label" for="exampleFormControlInput1">Email adresa</label>
                <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com"
                  required>
              </div>
              <div class="form-group mb-3 mx-2">
                <label class="form-label" for="inputPassword2" class="sr-only">Sifra</label>
                <input type="password" class="form-control" id="inputPassword2" placeholder="Sifra" required>
              </div>
              <div class="form-group mb-3 mx-2">
                <label class="form-label" for="birthDate">Datum rodjenja</label>
                <input id="birthDate" class="form-control" type="date" required />
              </div>
              <div class="form-group mb-3 mx-2">
                <label class="form-label" for="phone">Broj telefona</label>
                <input type="text" id="phone" class="form-control" data-mdb-input-mask="+381 999-999-999" required />
              </div>
              <div class="col-md-4 mb-3 mx-2">
                <label class="form-label" for="validationDefaultUsername">Korisnicko ime</label>
                <div class="input-group">
                  <div class="input-group-prepend">
                    <span class="input-group-text" id="inputGroupPrepend2">@</span>
                  </div>
                  <input type="text" class="form-control" id="validationDefaultUsername" placeholder="Korisnicko ime"
                    aria-describedby="inputGroupPrepend2" required>
                </div>
              </div>
              <div class="form-row">
                <div class="col-md-6 mb-3 mx-2">
                  <label class="form-label" for="validationDefault03">Adresa</label>
                  <input type="text" class="form-control" id="validationDefault03" placeholder="Adresa" required>
                </div>
              </div>
              <div class="form-group mb-2 mx-2">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" value="" id="invalidCheck2" required>
                  <label class="form-check-label" for="invalidCheck2">
                    Prihvatam uslove koriscenja i pristajem na odradu mojih podataka
                  </label>
                </div>
              </div>
              <button class="btn btn-primary" type="submit">Submit</button>
            </div>
          </form>
        </div>

        <!-- Modal footer -->
        <div class="modal-footer">
          <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>



<!-- About section-->
<div class="row pt-4 pb-3 trening-box">
  <section id="about-trening">
    <div class="container px-4">
        <div class="row gx-4 justify-content-center">
            <div class="col-lg-8">
              <img class="card-img-top" src="../../../images/heavylift2.jpg" alt="Card image cap">
                <h2>O treningu</h2>
                <p class="lead">Informacije o treningu: </p>
                <ul>
                    <li>ID: </li>
                    <li>Naziv: </li>
                    <li>Kratak opis: </li>
                    <li>Tipovi treninga: </li>
                    <li>Trajanje: </li>
                    <li>Maksimalan broj osoba: </li>
                    <li>Detaljan opis: </li>
                </ul>
            </div>
        </div>
    </div>
</section>
</div>


<!-- Footer-->
<footer class="py-5 bg-dark">
  <div class="container px-4"><p class="m-0 text-center text-white">Copyright &copy; AllTimeFit 2022</p></div>
</footer>
</body>
</html>
