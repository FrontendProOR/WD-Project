  <script type="text/javascript">
    
    //takodje napravi ucitavanje kartica u listi treninga ili ti gym.html
    var ime = document.getElementById('ime');
    var prezime = document.getElementById('prezime');
    var email = document.getElementById('email');
    var lozinka = document.getElementById('lozinka');
    var datumRodjenja = document.getElementById('datumRodjenja');
    var brojTelefona = document.getElementById('brojTelefona');
    var korisnickoIme = document.getElementById('korisnickoIme');
    var adresa = document.getElementById('adresa');

    function registracija() {
      var usersRef = firebase.database().ref('korisnici');
      
        

        $("#staticBackdrop").on("click", ".btn-primary", function () {
            if(validacijaPodataka()){ 
            var users = usersRef.push();
            users.set({
                "ime": ime.value,
                "prezime": prezime.value,
                "email": email.value,
                "lozinka": lozinka.value,
                "datumRodjenja": datumRodjenja.value,
                "telefon": brojTelefona.value,
                "korisnickoIme": korisnickoIme.value,
                "adresa": adresa.value
            });
          }else{
            alert("Pokusajte ponovo!");
          }
            window.location.reload(true);
        });
      
    }
    function validacijaPodataka(){
      let imePrezimeRegex = /[a-zA-Z]{2,20}$/;//od malih slova do velikih i spejsova
      let korisnickoImeRegex = /[a-zA-Z0-9]{2,15}$/;
      let passwordRegex = /^[a-zA-Z0-9!@#$&()`.+,/"-]{8,}/; // /^(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[a-zA-Z]).{8,}$ password veliko malo slovo min 8 karaktera i simbol
      let adresaRegex = /[a-zA-Z0-9\s\"\'\.\,]/;//adresa regex slova brojevi zarez minus space tacka navodnici
      let emailRegex =/[\w\.-]+@[\w\.-]+\.\w{2,4}/;
      let telefonRegex = /^\s*(?:\+?(\d{1,3}))?[-. (]*(\d{3})[-. )]*(\d{3})[-. ]*(\d{3})(?: *x(\d+))?\s*$/;//brojevi sa 065123456 ili sa +381654342323 samo za srbijanske i bosanske za vannjsku mrezu i unutrasnju
      let proslo = true;
      if(!imePrezimeRegex.test(ime.value) ||
      !imePrezimeRegex.test(prezime.value) ||
      !korisnickoImeRegex.test(korisnickoIme.value) ||
      !passwordRegex.test(lozinka.value) ||
      !emailRegex.test(email.value) ||
      !adresaRegex.test(adresa.value) ||
      !telefonRegex.test(brojTelefona.value)
      ){ proslo = false;}
      //uslov iznad je za los unos onda prosledjuje false sto okida alert pokusaj ponovo
      return proslo;
      
    }

    var email1 = document.getElementById("exampleInputEmail1");
    var sifra1 = document.getElementById("exampleInputPassword1");
    var checkbox1 = document.getElementById("exampleCheck1");
    var email1Regex = /[\w\.-]+@[\w\.-]+\.\w{2,4}/;
    var sifra1Regex = /[a-zA-Z0-9]{2,}/;
    //exampleInputEmail1 exampleInputPassword1 exampleCheck1
    function signInValidation() {

if (email1Regex.test(email1.value) && sifra1Regex.test(sifra1.value) && checkbox1.checked == true) {
  var usersRef = firebase.database().ref('korisnici');
  usersRef.on('value', function (snapshot) {
    var users = snapshot.val();
    snapshot.forEach(function (userSnapshot) {
      let key = userSnapshot.key;
      let user = userSnapshot.val();
      if (user.lozinka == sifra1.value && user.email == email1.value) {
        alert("Ulogovani ste .");
        $(function () {
          $('#signInModal').modal('toggle');
        });
      }else{
        window.location.reload(true);
      }
    });
  });
} else {
  alert("Pokusaj ponovo.");
  window.location.reload(true);
}

}
