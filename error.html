<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error Not Found</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
</head>
<body>
  <div class="container d-flex justify-content-center align-items-center" style="height: 100vh;width:100vw;">
    <div class="row">
      <div class="col-md-12">
        <div class="error-template">
          <h1>Ups!</h1>
          <h2>404 Not Found</h2>
          <div class="error-details">
            <details>
              <summary>Trazena stranica nije trenutno dostupna!</summary>
              <p>U naziv mejla stavite: Error 404 ili Error 405 sa Imenom i Prezimenom</p>
            </details>
          </div>
          <div class="error-actions">
            <a href="index.html" class="btn btn-primary btn-lg mt-3">
            <span class="glyphicon glyphicon-home">Glavna strana</span>
            </a>
            <a href="index.html#contact" class="btn btn-default btn-lg mt-3">
            <span class="glyphicon glyphicon-envelope text-primary">Kontaktirajte nas</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
