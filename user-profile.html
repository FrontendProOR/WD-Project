  <!-- The Modal sign in -->
  <div class="modal fade" id="signInModal">
    <div class="modal-dialog">
      <div class="modal-content">

        <!-- Modal Header -->
        <div class="modal-header">
          <h4 class="modal-title">Uloguj se</h4>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <!-- Modal body -->
        <div class="modal-body">
          <form>
            <div class="form-group">
              <label for="exampleInputEmail1">Email adresa</label>
              <input type="text" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp"
                placeholder="Unesi email" autocomplete="">
              <small id="emailHelp" class="form-text text-muted ">Vas mejl je bezbedan sa nama.</small>
            </div>
            <div class="form-group mb-2">
              <label for="exampleInputPassword1">Sifra</label>
              <input type="password" class="form-control" id="exampleInputPassword1" placeholder="Unesite sifru"

            </div>
            <div class="form-check mb-2">
              <input type="checkbox" class="form-check-input " id="exampleCheck1">
              <label class="form-check-label " for="exampleCheck1">Uslovi koriscenja</label>
            </div>
            <button type="submit" class="btn btn-primary mb-3" onclick="signInValidation()">Uloguj se</button>

        </div>

        <!-- Modal footer -->
        <div class="modal-footer">
          <button type="button" class="btn btn-danger" data-bs-toggle="signInModal"

        </div>
      </div>
    </div>
  </div>

  <!-- The Modal sign up -->
  <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
    aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="staticBackdropLabel">Registracija Korisnika</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <!--Add user form-->
          <div class="bg-light container w-75">
            <form>
              <div class="form-row px-3">
                <div class="col-md-4 mb-3 mx-2">
                  <label class="form-label" for="ime">Ime</label>
                  <input type="text" class="form-control" id="ime" placeholder="Ime">
                </div>
                <div class="col-md-4 mb-3 mx-2">
                  <label class="form-label" for="prezime">Prezime</label>
                  <input type="text" class="form-control" id="prezime" placeholder="Prezime">
                </div>
                <div class="form-group mb-3 mx-2">
                  <label class="form-label" for="email">Email adresa</label>
                  <input type="email" class="form-control" id="email" placeholder="Unesite vas mejl">
                </div>
                <div class="form-group mb-3 mx-2">
                  <label class="form-label" for="lozinka" class="sr-only">Lozinka</label>
                  <input type="password" class="form-control" id="lozinka" placeholder="Lozinka"
                    autocomplete="current-password">
                  <p style="font-size: smaller;">Unesite minimum 8 karaktera.</p>
                </div>
                <div class="form-group mb-3 mx-2">
                  <label class="form-label" for="datumRodjenja">Datum rodjenja</label>
                  <input id="datumRodjenja" class="form-control" type="date" min="1900-01-01" max="2016-01-01" />
                </div>
                <div class="form-group mb-3 mx-2">
                  <label class="form-label" for="brojTelefona">Broj telefona</label>
                  <input type="text" id="brojTelefona" class="form-control" placeholder="Upisite broj telefona" />
                  <p style="font-size: smaller;">Molimo vas da broj telefona sadrzi pozivni broj(+381,+387,...)</p>
                </div>
                <div class="col-md-4 mb-3 mx-2">
                  <label class="form-label" for="korisnickoIme">Korisnicko ime</label>
                  <div class="input-group">
                    <div class="input-group-prepend">
                      <span class="input-group-text" id="inputGroupPrepend2">@</span>
                    </div>
                    <input type="text" class="form-control" id="korisnickoIme" placeholder="Korisnicko ime"
                      aria-describedby="inputGroupPrepend2">
                  </div>
                </div>
                <div class="form-row">
                  <div class="col-md-6 mb-3 mx-2">
                    <label class="form-label" for="adresa">Adresa</label>
                    <input type="text" class="form-control" id="adresa" placeholder="Adresa">
                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Zatvori</button>
          <button type="button" class="btn btn-primary" type="submit" data-bs-dismiss="modal"
            onclick="registracija()">Posalji</button>
        </div>

  <!--Here is user data-->
  <div class="justify-content-center align-self-center bd-highlight" style="margin: 15vh 15vw">

      <img src="#" class="rounded-circle" alt="Slika korisnika" width="100px" height="100px"><!--link ako bude se dodavao u bazu-->

    </div>

  <!-- Footer-->

  <script type="text/javascript">
    var kliknutiProfilId = localStorage.getItem("clickedProfileId");
    var usersRef = firebase.database().ref('korisnici');

    var ime = document.getElementById('ime');
    var prezime = document.getElementById('prezime');
    var email = document.getElementById('email');
    var lozinka = document.getElementById('lozinka');
    var datumRodjenja = document.getElementById('datumRodjenja');
    var brojTelefona = document.getElementById('brojTelefona');
    var korisnickoIme = document.getElementById('korisnickoIme');
    var adresa = document.getElementById('adresa');

    function registracija() {
      $("#staticBackdrop").on("click", ".btn-primary", function () {
        if (validacijaPodataka()) {
          var users = usersRef.push();
          users.set({
            "ime": ime.value,
            "prezime": prezime.value,
            "email": email.value,
            "lozinka": lozinka.value,
            "datumRodjenja": datumRodjenja.value,
            "telefon": brojTelefona.value,
            "korisnickoIme": korisnickoIme.value,
            "adresa": adresa.value
          });
        } else {
          alert("Pokusajte ponovo!");
        }
        window.location.reload(true);
      });

    }
    function validacijaPodataka() {
      let imePrezimeRegex = /[a-zA-Z\s]{2,20}$/;//od malih slova do velikih i spejsova
      let korisnickoImeRegex = /[a-zA-Z0-9\s]{2,15}/;
      let passwordRegex = /^[a-zA-Z0-9!@#$%\s&()`.+,/"-]{8,50}/; // /^(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[a-zA-Z]).{8,}$ password veliko malo slovo min 8 karaktera i simbol
      let adresaRegex = /[a-zA-Z0-9\\/'",.\s]{5,50}/;//adresa regex slova brojevi zarez minus space tacka navodnici
      let emailRegex = /[\w\.-]+@[\w\.-]+\.\w{2,4}/;
      let telefonRegex = /[0-9+\-|\/\\/]{6,15}/;//brojevi sa 065123456 ili sa +381654342323 samo za srbijanske i bosanske za vannjsku mrezu i unutrasnju
      let proslo = true;
      if (!imePrezimeRegex.test(ime.value) ||
        !imePrezimeRegex.test(prezime.value) ||
        !korisnickoImeRegex.test(korisnickoIme.value) ||
        !passwordRegex.test(lozinka.value) ||
        !emailRegex.test(email.value) ||
        !adresaRegex.test(adresa.value) ||
        !telefonRegex.test(brojTelefona.value)
      ) { proslo = false; }

      //uslov iznad je za los unos onda prosledjuje false sto okida alert pokusaj ponovo
      return proslo;

    }

    var email1 = document.getElementById("exampleInputEmail1");
    var sifra1 = document.getElementById("exampleInputPassword1");
    var checkbox1 = document.getElementById("exampleCheck1");
    var email1Regex = /[\w\.-]+@[\w\.-]+\.\w{2,4}/;
    var sifra1Regex = /^[a-zA-Z0-9!@#$%\s&()`.+,/"-]{8,}/;
    //exampleInputEmail1 exampleInputPassword1 exampleCheck1
    function signInValidation() {

      if (email1Regex.test(email1.value) && sifra1Regex.test(sifra1.value) && checkbox1.checked == true) {
        var usersRef = firebase.database().ref('korisnici');
        usersRef.on('value', function (snapshot) {
          var users = snapshot.val();
          snapshot.forEach(function (userSnapshot) {
            let key = userSnapshot.key;
            let user = userSnapshot.val();
            if (user.lozinka == sifra1.value && user.email == email1.value) {
              alert("Ulogovani ste .");
              $(function () {
                $('#signInModal').modal('toggle');
              });
            } else {
              window.location.reload(true);
            }
          });
        });
      } else {
        alert("Pokusaj ponovo.");
        window.location.reload(true);
      }
    }

    var trenutniKorisnikRef = firebase.database().ref('korisnici').child(kliknutiProfilId);
    trenutniKorisnikRef.on('value', function (usersnapshot) {
      var korisnik = usersnapshot.val();
      var KorisnickeInformacije = document.getElementById("userInfo");
      KorisnickeInformacije.classList.add("bg-dark", "d-flex", "flex-column", "justify-content-center", "mb-3");
      KorisnickeInformacije.style.width = "70vw";

      var ime = document.createElement("div");
      ime.classList.add("mb-2", "text-center", "text-white", "bd-highlight", "flex-fill", "border", "border-white");
      ime.innerText = "Ime: " + korisnik.ime;

      var prezime = document.createElement("div");
      prezime.classList.add("mb-2", "text-center", "text-white", "bd-highlight", "flex-fill");
      prezime.innerText = "Prezime: " + korisnik.prezime;

      var godinaRodjenja = document.createElement("div");
      godinaRodjenja.classList.add("mb-2", "text-center", "text-white", "bd-highlight", "flex-fill", "border", "border-white");
      godinaRodjenja.innerText = "Datum rodjenja: " + korisnik.datumRodjenja;

      var adresa = document.createElement("div");
      adresa.classList.add("mb-2", "text-center", "text-white", "bd-highlight", "flex-fill");
      adresa.innerText = "Adresa : " + korisnik.adresa;

      var telefon = document.createElement("div");
      telefon.classList.add("mb-2", "text-center", "text-white", "bd-highlight", "flex-fill", "border", "border-white");
      telefon.innerText = "Broj telefona: " + korisnik.telefon;

      var korisnickoIme1 = document.createElement("div");
      korisnickoIme1.classList.add("mb-2", "text-center", "text-white", "bd-highlight", "flex-fill");
      korisnickoIme1.innerText = "Korisnicko Ime: " + korisnik.korisnickoIme;

      var emailKorisnicki = document.createElement("div");
      emailKorisnicki.classList.add("mb-2", "text-center", "text-white", "bd-highlight", "flex-fill", "border", "border-white");
      emailKorisnicki.innerText = "Email: " + korisnik.email;


      KorisnickeInformacije.appendChild(ime);
      KorisnickeInformacije.appendChild(prezime);
      KorisnickeInformacije.appendChild(godinaRodjenja);
      KorisnickeInformacije.appendChild(adresa);
      KorisnickeInformacije.appendChild(telefon);
      KorisnickeInformacije.appendChild(korisnickoIme1);
      KorisnickeInformacije.appendChild(emailKorisnicki);
    });
  </script>
